name: HabitTracker
options:
  bundleIdPrefix: com.habittracker
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HabitTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: HabitTracker
        excludes:
          - "Preview Content/**"
          - "Resources/**"
      - path: HabitTracker/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: HabitTracker/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        DEVELOPMENT_ASSET_PATHS: "\"HabitTracker/Preview Content\""
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - HabitTrackerTests
      # Local test products, used when running from Xcode. The App Store build uses the real ones.
      storeKitConfiguration: StoreKit/Products.storekit
  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitTrackerTests
      - path: StoreKit/Products.storekit
        buildPhase: resources
    dependencies:
      - target: HabitTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.emilhenriksson.habittracker.tests
